[package]
name = "strix-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform adapters: MAVLink, ROS2, Simulator (Puppet Master layer)"

[features]
default = []
# Enable real MAVLink hardware connection (PX4 / ArduPilot via UDP/TCP/Serial).
# Without this feature the MAVLink adapter uses stub behaviour (no external deps).
mavlink-hw = ["dep:mavlink"]

[dependencies]
strix-core = { path = "../strix-core" }
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
mavlink = { git = "https://github.com/mavlink/rust-mavlink", rev = "25cbe4e6a85d62b2ee8320b1a3d2935e0be309fa", version = "0.18", features = ["dialect-ardupilotmega"], optional = true }
